<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Self Notes</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background-color: #1a1a1a;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
      }

      .container {
        width: 100%;
        max-width: 95vw;
        height: 90vh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }

      .room-input {
        margin-bottom: 20px;
        text-align: center;
        flex-shrink: 0;
      }

      .room-input input {
        padding: 10px;
        font-size: 16px;
        border: 2px solid #444;
        border-radius: 4px;
        background-color: #333;
        color: #fff;
        width: 200px;
        height: 20px;
        line-height: 20px;
      }

      .room-input button {
        padding: 0 15px;
        font-size: 12px;
        background: #8b4513;
        color: #ffd700;
        border: 3px solid #654321;
        box-shadow: 3px 3px 0px #654321;
        transition: all 0.1s ease;
        text-shadow: 1px 1px 0px #654321;
        height: 44px;
        line-height: 38px;
        margin-left: 10px;
        position: relative;
        font-family: "Press Start 2P", "Courier New", monospace;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
      }

      .room-input button:hover {
        background-color: #a0522d;
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px #654321;
      }

      .room-input button:active {
        transform: translate(3px, 3px);
        box-shadow: none;
      }

      .notes-container {
        display: none;
        width: 100%;
        height: calc(100% - 80px);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      textarea {
        width: 100%;
        height: 45%;
        padding: 15px;
        border: 2px solid #444;
        border-radius: 4px;
        background-color: #333;
        color: #fff;
        font-size: 14px;
        resize: none;
        font-family: "Courier New", Courier, monospace;
        line-height: 1.5;
        tab-size: 4;
        overflow-y: auto;
      }

      .last-message {
        width: 100%;
        height: 45%;
        padding: 15px;
        border: 2px solid #444;
        border-radius: 4px;
        background-color: #333;
        color: #fff;
        font-size: 14px;
        white-space: pre-wrap;
        overflow-y: auto;
        font-family: "Courier New", Courier, monospace;
        line-height: 1.5;
      }

      .status {
        margin-top: 10px;
        color: #888;
        font-size: 14px;
        flex-shrink: 0;
      }

      /* Custom scrollbar for better visibility */
      textarea::-webkit-scrollbar,
      .last-message::-webkit-scrollbar {
        width: 12px;
      }

      textarea::-webkit-scrollbar-track,
      .last-message::-webkit-scrollbar-track {
        background: #2a2a2a;
        border-radius: 6px;
      }

      textarea::-webkit-scrollbar-thumb,
      .last-message::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 6px;
      }

      textarea::-webkit-scrollbar-thumb:hover,
      .last-message::-webkit-scrollbar-thumb:hover {
        background: #666;
      }

      @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");
    </style>
  </head>
  <body>
    <div class="container">
      <div class="room-input">
        <input
          type="text"
          id="roomCode"
          placeholder="Enter room code"
          pattern="[A-Za-z0-9]+"
          required
        />
        <button onclick="joinRoom()">Join Room</button>
      </div>
      <div class="notes-container" id="notesContainer">
        <textarea
          id="notesInput"
          placeholder="Type or paste your notes here..."
        ></textarea>
        <div class="last-message" id="lastMessage"></div>
        <div class="status" id="status"></div>
      </div>
    </div>

    <script>
      const socket = io();
      let currentRoom = null;

      function joinRoom() {
        const roomInput = document.getElementById("roomCode");
        const roomCode = roomInput.value.trim();

        if (!roomCode.match(/^[A-Za-z0-9]+$/)) {
          alert("Please enter a valid alphanumeric room code");
          return;
        }

        if (currentRoom) {
          socket.emit("leave-room", currentRoom);
        }

        currentRoom = roomCode;
        socket.emit("join-room", roomCode);

        document.getElementById("notesContainer").style.display = "block";
        document.getElementById(
          "status"
        ).textContent = `Connected to room: ${roomCode}`;
      }

      const notesInput = document.getElementById("notesInput");
      notesInput.addEventListener("input", () => {
        if (currentRoom) {
          socket.emit("message", {
            roomCode: currentRoom,
            message: notesInput.value,
          });
        }
      });

      socket.on("message", (message) => {
        document.getElementById("lastMessage").textContent = message;
      });

      socket.on("connect", () => {
        document.getElementById("status").textContent = "Connected to server";
      });

      socket.on("disconnect", () => {
        document.getElementById("status").textContent =
          "Disconnected from server";
      });
    </script>
  </body>
</html>
