<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Self Notes</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background-color: #1a1a1a;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
      }

      .container {
        width: 100%;
        max-width: 95vw;
        height: 90vh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }

      .room-input {
        margin-bottom: 20px;
        text-align: center;
        flex-shrink: 0;
      }

      .room-input input {
        padding: 10px;
        font-size: 16px;
        border: 2px solid #444;
        border-radius: 4px;
        background-color: #333;
        color: #fff;
        width: 200px;
        height: 20px;
        line-height: 20px;
      }

      .room-input button {
        padding: 0 15px;
        font-size: 12px;
        background: #8b4513;
        color: #ffd700;
        border: 3px solid #654321;
        box-shadow: 3px 3px 0px #654321;
        transition: all 0.1s ease;
        text-shadow: 1px 1px 0px #654321;
        height: 44px;
        line-height: 38px;
        margin-left: 10px;
        position: relative;
        font-family: "Press Start 2P", "Courier New", monospace;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
      }

      .room-input button:hover {
        background-color: #a0522d;
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px #654321;
      }

      .room-input button:active {
        transform: translate(3px, 3px);
        box-shadow: none;
      }

      .notes-container {
        display: none;
        width: 100%;
        height: calc(100% - 80px);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      textarea,
      .last-message {
        width: 100%;
        padding: 15px;
        border: 2px solid #444;
        border-radius: 4px;
        background-color: #333;
        color: #fff;
        font-size: 14px;
        font-family: "Courier New", Courier, monospace;
        line-height: 1.5;
        box-sizing: border-box;
      }

      textarea {
        height: 45%;
        resize: none;
        tab-size: 4;
        overflow-y: auto;
      }

      .last-message-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        height: 45%;
        min-height: 0;
      }

      .last-message-header {
        display: flex;
        justify-content: flex-end;
        flex-shrink: 0;
      }

      .copy-button {
        padding: 0 12px;
        font-size: 10px;
        background: #8b4513;
        color: #ffd700;
        border: 3px solid #654321;
        box-shadow: 3px 3px 0px #654321;
        transition: all 0.1s ease;
        text-shadow: 1px 1px 0px #654321;
        height: 32px;
        line-height: 26px;
        font-family: "Press Start 2P", "Courier New", monospace;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
      }

      .copy-button:hover {
        background-color: #a0522d;
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px #654321;
      }

      .copy-button:active {
        transform: translate(3px, 3px);
        box-shadow: none;
      }

      .copy-button.copied {
        background: #2d5a27;
        border-color: #1a3d16;
        box-shadow: 3px 3px 0px #1a3d16;
        color: #90ee90;
      }

      .last-message {
        flex: 1;
        min-height: 0;
        white-space: pre-wrap;
        overflow-y: auto;
      }

      .status {
        margin-top: 10px;
        color: #888;
        font-size: 14px;
        font-family: "Press Start 2P", "Courier New", monospace;
        letter-spacing: 1px;
        flex-shrink: 0;
      }

      .warning-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        font-family: "Press Start 2P", "Courier New", monospace;
      }

      .warning-box {
        background-color: #8b4513;
        border: 4px solid #ffd700;
        padding: 20px;
        text-align: center;
        max-width: 80%;
        box-shadow: 4px 4px 0px #654321;
        position: relative;
      }

      .warning-title {
        color: #ffd700;
        font-size: 24px;
        margin-bottom: 20px;
        text-shadow: 2px 2px 0px #654321;
      }

      .warning-message {
        color: #fff;
        font-size: 16px;
        margin-bottom: 20px;
        line-height: 1.5;
      }

      .reload-button {
        background: #ffd700;
        color: #8b4513;
        border: none;
        padding: 10px 20px;
        font-family: "Press Start 2P", "Courier New", monospace;
        font-size: 14px;
        cursor: pointer;
        text-transform: uppercase;
        box-shadow: 3px 3px 0px #654321;
        transition: all 0.1s ease;
      }

      .reload-button:hover {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px #654321;
      }

      .reload-button:active {
        transform: translate(3px, 3px);
        box-shadow: none;
      }

      /* Custom scrollbar for better visibility */
      textarea::-webkit-scrollbar,
      .last-message::-webkit-scrollbar {
        width: 12px;
      }

      textarea::-webkit-scrollbar-track,
      .last-message::-webkit-scrollbar-track {
        background: #2a2a2a;
        border-radius: 6px;
      }

      textarea::-webkit-scrollbar-thumb,
      .last-message::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 6px;
      }

      textarea::-webkit-scrollbar-thumb:hover,
      .last-message::-webkit-scrollbar-thumb:hover {
        background: #666;
      }

      .credit {
        position: fixed;
        bottom: 12px;
        right: 20px;
        margin: 0;
        font-style: italic;
        font-size: 12px;
        color: #666;
      }

      @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");
    </style>
  </head>
  <body>
    <div class="container">
      <div class="room-input">
        <input
          type="text"
          id="roomCode"
          placeholder="Enter room code"
          pattern="[A-Za-z0-9]+"
          required
        />
        <button onclick="joinRoom()">Join Room</button>
      </div>
      <div class="notes-container" id="notesContainer">
        <textarea
          id="notesInput"
          placeholder="Type or paste your notes here..."
        ></textarea>
        <div class="last-message-section">
          <div class="last-message-header">
            <button
              type="button"
              class="copy-button"
              id="copyButton"
              onclick="copyLastMessage()"
            >
              Copy
            </button>
          </div>
          <div class="last-message" id="lastMessage"></div>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>

    <p class="credit">Developed by Patricia Fernandez</p>

    <div class="warning-overlay" id="warningOverlay">
      <div class="warning-box">
        <div class="warning-title">⚠️ CONNECTION LOST ⚠️</div>
        <div class="warning-message">
          The server has gone to sleep!<br />
          Please reload the page to reconnect.
        </div>
        <button class="reload-button" onclick="window.location.reload()">
          RELOAD PAGE
        </button>
      </div>
    </div>

    <script>
      const socket = io({
        reconnection: false, // Disable automatic reconnection
      });
      let currentRoom = null;
      let isDisconnected = false;

      function showWarning() {
        if (!isDisconnected) {
          isDisconnected = true;
          document.getElementById("warningOverlay").style.display = "flex";
        }
      }

      function hideWarning() {
        isDisconnected = false;
        document.getElementById("warningOverlay").style.display = "none";
      }

      function joinRoom() {
        const roomInput = document.getElementById("roomCode");
        const roomCode = roomInput.value.trim();

        if (!roomCode.match(/^[A-Za-z0-9]+$/)) {
          alert("Please enter a valid alphanumeric room code");
          return;
        }

        if (currentRoom) {
          socket.emit("leave-room", currentRoom);
        }

        currentRoom = roomCode;
        socket.emit("join-room", roomCode);

        document.getElementById("notesContainer").style.display = "block";
        document.getElementById("status").textContent =
          `Connected to room: ${roomCode}`;
      }

      const notesInput = document.getElementById("notesInput");
      notesInput.addEventListener("input", () => {
        if (currentRoom) {
          socket.emit("message", {
            roomCode: currentRoom,
            message: notesInput.value,
          });
        }
      });

      socket.on("message", (message) => {
        document.getElementById("lastMessage").textContent = message;
      });

      socket.on("connect", () => {
        document.getElementById("status").textContent = "Connected to server";
        hideWarning();
      });

      socket.on("disconnect", () => {
        document.getElementById("status").textContent =
          "Disconnected from server";
        showWarning();
      });

      socket.on("connect_error", () => {
        document.getElementById("status").textContent = "Connection error";
        showWarning();
      });

      let copyFeedbackTimeout = null;

      async function copyLastMessage() {
        const text = document.getElementById("lastMessage").textContent;
        const button = document.getElementById("copyButton");

        if (!text) {
          return;
        }

        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          document.body.removeChild(textarea);
        }

        button.textContent = "Copied!";
        button.classList.add("copied");

        if (copyFeedbackTimeout) {
          clearTimeout(copyFeedbackTimeout);
        }

        copyFeedbackTimeout = setTimeout(() => {
          button.textContent = "Copy";
          button.classList.remove("copied");
        }, 1500);
      }
    </script>
  </body>
</html>
